<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Job Locations</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

.hero{
  background:linear-gradient(135deg,#111827,#1e3a8a);
  color:white;
  padding:42px 20px;
  text-align:center;
}

.hero h1{
  margin:0 0 10px;
  font-size:38px;
}

.hero p{
  margin:0;
  opacity:.85;
}

.wrap{
  max-width:1000px;
  margin:30px auto;
  padding:0 16px;
}

.panel{
  background:white;
  border-radius:18px;
  padding:22px;
  box-shadow:0 8px 30px #00000012;
  margin-bottom:22px;
}

.panel h2{
  margin-top:0;
}

.form{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:12px;
}

input{
  width:100%;
  padding:13px 14px;
  border:1px solid #d8deea;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#2563eb;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 20px;
  background:#2563eb;
  color:white;
  font-weight:700;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.search{
  margin-bottom:18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:16px;
}

.card{
  background:white;
  border:1px solid #e6eaf0;
  border-radius:16px;
  padding:18px;
  box-shadow:0 5px 18px #0000000d;
}

.card h3{
  margin:0 0 12px;
  font-size:19px;
}

.card a{
  color:#2563eb;
  text-decoration:none;
  font-weight:700;
}

.muted{
  color:#667085;
  font-size:14px;
}

.status{
  color:#667085;
  font-size:14px;
}

.error{
  color:#b42318;
  background:#fef3f2;
  padding:12px;
  border-radius:10px;
  display:none;
  margin-top:12px;
}

.success{
  color:#067647;
  background:#ecfdf3;
  padding:12px;
  border-radius:10px;
  display:none;
  margin-top:12px;
}

.admin-buttons{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.edit-btn{
  background:#f59e0b;
  padding:9px 13px;
}

.delete-btn{
  background:#dc2626;
  padding:9px 13px;
}

.cancel-btn{
  background:#667085;
}

.login-panel{
  display:none;
}

.user-info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.logout-btn{
  background:#111827;
  padding:9px 15px;
}

.modal{
  display:none;
  position:fixed;
  z-index:1000;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:#00000080;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-box{
  background:white;
  width:100%;
  max-width:500px;
  padding:25px;
  border-radius:18px;
  box-shadow:0 20px 60px #00000040;
}

.modal-box h2{
  margin-top:0;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.modal-actions button{
  flex:1;
}

@media(max-width:700px){

  .form{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:30px;
  }

  .admin-buttons{
    flex-direction:column;
  }

  .modal-actions{
    flex-direction:column;
  }

}

</style>
</head>

<body>

<section class="hero">
  <h1>📍 Job Locations</h1>
  <p>Find the latest hiring locations quickly</p>
</section>

<main class="wrap">

<!-- ADMIN LOGIN -->

<section class="panel login-panel" id="loginPanel">

  <h2>🔐 Admin Login</h2>

  <div class="form" style="grid-template-columns:1fr 1fr auto;">

    <input
      id="loginEmail"
      type="email"
      placeholder="Admin email"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Password"
    >

    <button id="loginBtn">
      Login
    </button>

  </div>

  <div id="loginError" class="error"></div>

</section>


<!-- ADMIN AREA -->

<section class="panel" id="adminPanel" style="display:none;">

  <div class="user-info">

    <div>
      <strong>🔐 Admin Mode</strong>
      <div class="muted" id="adminEmail"></div>
    </div>

    <button
      class="logout-btn"
      id="logoutBtn"
    >
      Logout
    </button>

  </div>

  <h2>➕ Add Job Location</h2>

  <div class="form">

    <input
      id="name"
      placeholder="Location name (e.g. Okhla Bird Sanctuary)"
    >

    <input
      id="url"
      placeholder="Google Maps / location link"
    >

    <button id="addBtn">
      Add Location
    </button>

  </div>

  <div id="error" class="error"></div>

  <div id="success" class="success"></div>

</section>


<!-- LOCATIONS -->

<section class="panel">

  <input
    class="search"
    id="search"
    placeholder="🔎 Search job locations..."
  >

  <div id="locations" class="grid"></div>

  <div
    id="status"
    class="status"
  >
    Loading locations...
  </div>

</section>

</main>


<!-- EDIT MODAL -->

<div
  class="modal"
  id="editModal"
>

  <div class="modal-box">

    <h2>✏️ Update Location</h2>

    <input
      id="editName"
      placeholder="Location name"
      style="margin-bottom:12px;"
    >

    <input
      id="editUrl"
      placeholder="Google Maps link"
    >

    <div class="modal-actions">

      <button
        class="cancel-btn"
        id="cancelEdit"
      >
        Cancel
      </button>

      <button
        id="saveEdit"
      >
        Save Changes
      </button>

    </div>

    <div
      id="editError"
      class="error"
    ></div>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://uxbrasxagfcwtbngsgbf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_iOaSV2iIxiqd6yhqkPq-Sw_odBOgt-K";

const ADMIN_EMAIL =
"thakurchandan0109@gmail.com";

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let allLocations = [];
let editingId = null;


/* =========================
   AUTH CHECK
========================= */

async function checkUser(){

  const {
    data:{
      session
    }
  } = await db.auth.getSession();

  if(session && session.user){

    if(
      session.user.email.toLowerCase()
      ===
      ADMIN_EMAIL.toLowerCase()
    ){

      showAdmin(session.user);

    }else{

      await db.auth.signOut();
      hideAdmin();

    }

  }else{

    hideAdmin();

  }

}


/* =========================
   SHOW ADMIN
========================= */

function showAdmin(user){

  document.getElementById("adminPanel")
    .style.display="block";

  document.getElementById("loginPanel")
    .style.display="none";

  document.getElementById("adminEmail")
    .textContent=user.email;

}


/* =========================
   HIDE ADMIN
========================= */

function hideAdmin(){

  document.getElementById("adminPanel")
    .style.display="none";

  document.getElementById("loginPanel")
    .style.display="block";

}


/* =========================
   LOGIN
========================= */

document
.getElementById("loginBtn")
.addEventListener("click",async()=>{

  const email =
    document
    .getElementById("loginEmail")
    .value
    .trim();

  const password =
    document
    .getElementById("loginPassword")
    .value;

  if(!email || !password){

    showLoginError(
      "Email aur password dono bharna zaroori hai."
    );

    return;
  }

  if(
    email.toLowerCase()
    !==
    ADMIN_EMAIL.toLowerCase()
  ){

    showLoginError(
      "Sirf admin account login kar sakta hai."
    );

    return;
  }

  const btn =
    document.getElementById("loginBtn");

  btn.disabled=true;
  btn.textContent="Logging in...";

  const {
    data,
    error
  } =
  await db.auth.signInWithPassword({
    email,
    password
  });

  btn.disabled=false;
  btn.textContent="Login";

  if(error){

    showLoginError(
      "Login failed: "+error.message
    );

    return;
  }

  if(data.user){

    showAdmin(data.user);

    document
      .getElementById("loginPassword")
      .value="";

  }

});


/* =========================
   LOGOUT
========================= */

document
.getElementById("logoutBtn")
.addEventListener("click",async()=>{

  await db.auth.signOut();

  hideAdmin();

});


/* =========================
   LOAD LOCATIONS
========================= */

async function loadLocations(){

  const {
    data,
    error
  } =
  await db
  .from("locations")
  .select(
    "id,name,url,created_at"
  )
  .order(
    "created_at",
    {
      ascending:false
    }
  );

  if(error){

    showError(
      "Locations load nahi ho pa rahi: "
      +error.message
    );

    document
      .getElementById("status")
      .textContent="";

    return;
  }

  allLocations=data || [];

  render(allLocations);

}


/* =========================
   RENDER
========================= */

function render(items){

  const box =
    document.getElementById("locations");

  const status =
    document.getElementById("status");

  box.innerHTML="";

  if(!items.length){

    status.textContent =
      "Abhi koi job location add nahi hai.";

    return;
  }

  status.textContent="";


  items.forEach(x=>{

    const card =
      document.createElement("div");

    card.className="card";


    const h =
      document.createElement("h3");

    h.textContent =
      "📍 "+x.name;


    const p =
      document.createElement("p");

    p.className="muted";

    p.textContent =
      "Job location";


    const a =
      document.createElement("a");

    a.href=x.url;

    a.target="_blank";

    a.rel=
      "noopener noreferrer";

    a.textContent=
      "Open Location →";


    card.append(
      h,
      p,
      a
    );


    /* ADMIN BUTTONS */

    const adminButtons =
      document.createElement("div");

    adminButtons.className=
      "admin-buttons";

    const editButton =
      document.createElement("button");

    editButton.className=
      "edit-btn";

    editButton.textContent=
      "✏️ Edit";

    editButton.onclick=
      ()=>openEdit(x);


    const deleteButton =
      document.createElement("button");

    deleteButton.className=
      "delete-btn";

    deleteButton.textContent=
      "🗑️ Delete";

    deleteButton.onclick=
      ()=>deleteLocation(x);


    adminButtons.append(
      editButton,
      deleteButton
    );


    card.appendChild(
      adminButtons
    );


    box.appendChild(card);

  });

}


/* =========================
   SEARCH
========================= */

document
.getElementById("search")
.addEventListener(
  "input",
  e=>{

    const q =
      e.target.value
      .toLowerCase()
      .trim();

    render(
      allLocations.filter(
        x =>
          (x.name || "")
          .toLowerCase()
          .includes(q)
      )
    );

  }
);


/* =========================
   ADD LOCATION
========================= */

document
.getElementById("addBtn")
.addEventListener(
  "click",
  async()=>{

    const name =
      document
      .getElementById("name")
      .value
      .trim();

    const url =
      document
      .getElementById("url")
      .value
      .trim();


    if(!name || !url){

      showError(
        "Location name aur link dono bharna zaroori hai."
      );

      return;
    }


    hideError();


    const btn =
      document
      .getElementById("addBtn");

    btn.disabled=true;

    btn.textContent=
      "Adding...";


    const {
      error
    } =
    await db
    .from("locations")
    .insert([
      {
        name:name,
        url:url
      }
    ]);


    btn.disabled=false;

    btn.textContent=
      "Add Location";


    if(error){

      showError(
        "Add nahi hua: "
        +error.message
      );

      return;
    }


    document
      .getElementById("name")
      .value="";

    document
      .getElementById("url")
      .value="";


    showSuccess(
      "✅ Location successfully added."
    );


    await loadLocations();

  }
);


/* =========================
   OPEN EDIT
========================= */

function openEdit(location){

  editingId =
    location.id;

  document
    .getElementById("editName")
    .value =
    location.name;

  document
    .getElementById("editUrl")
    .value =
    location.url;

  document
    .getElementById("editError")
    .style.display="none";

  document
    .getElementById("editModal")
    .style.display="flex";

}


/* =========================
   CANCEL EDIT
========================= */

document
.getElementById("cancelEdit")
.addEventListener(
  "click",
  ()=>{

    editingId=null;

    document
      .getElementById("editModal")
      .style.display="none";

  }
);


/* =========================
   SAVE UPDATE
========================= */

document
.getElementById("saveEdit")
.addEventListener(
  "click",
  async()=>{

    if(!editingId){

      return;
    }


    const name =
      document
      .getElementById("editName")
      .value
      .trim();

    const url =
      document
      .getElementById("editUrl")
      .value
      .trim();


    if(!name || !url){

      showEditError(
        "Location name aur link dono bharna zaroori hai."
      );

      return;
    }


    const btn =
      document
      .getElementById("saveEdit");

    btn.disabled=true;

    btn.textContent=
      "Updating...";


    const {
      error
    } =
    await db
    .from("locations")
    .update({
      name:name,
      url:url
    })
    .eq(
      "id",
      editingId
    );


    btn.disabled=false;

    btn.textContent=
      "Save Changes";


    if(error){

      showEditError(
        "Update nahi hua: "
        +error.message
      );

      return;
    }


    document
      .getElementById("editModal")
      .style.display="none";

    editingId=null;


    showSuccess(
      "✅ Location successfully updated."
    );


    await loadLocations();

  }
);


/* =========================
   DELETE LOCATION
========================= */

async function deleteLocation(location){

  const confirmDelete =
    confirm(
      'Kya aap "'+
      location.name+
      '" ko delete karna chahte hain?'
    );


  if(!confirmDelete){

    return;
  }


  const {
    error
  } =
  await db
  .from("locations")
  .delete()
  .eq(
    "id",
    location.id
  );


  if(error){

    showError(
      "Delete nahi hua: "
      +error.message
    );

    return;
  }


  showSuccess(
    "🗑️ Location successfully deleted."
  );


  await loadLocations();

}


/* =========================
   ERROR / SUCCESS
========================= */

function showError(msg){

  const e =
    document.getElementById("error");

  e.textContent=msg;

  e.style.display="block";

}


function hideError(){

  document
    .getElementById("error")
    .style.display="none";

}


function showSuccess(msg){

  const e =
    document.getElementById("success");

  e.textContent=msg;

  e.style.display="block";

  setTimeout(
    ()=>{
      e.style.display="none";
    },
    3000
  );

}


function showLoginError(msg){

  const e =
    document
    .getElementById("loginError");

  e.textContent=msg;

  e.style.display="block";

}


function showEditError(msg){

  const e =
    document
    .getElementById("editError");

  e.textContent=msg;

  e.style.display="block";

}


/* =========================
   START
========================= */

checkUser();

loadLocations();


/* =========================
   AUTH STATE CHANGE
========================= */

db.auth.onAuthStateChange(
  (event,session)=>{

    if(
      session &&
      session.user &&
      session.user.email
      .toLowerCase()
      ===
      ADMIN_EMAIL.toLowerCase()
    ){

      showAdmin(session.user);

    }else{

      hideAdmin();

    }

  }
);

</script>

</body>
</html>
