<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delhi Job Locations</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}
header{background:linear-gradient(135deg,#111827,#334155);color:#fff;padding:28px 18px;text-align:center}
h1{margin:0 0 7px;font-size:28px}.sub{opacity:.82;font-size:14px}
.wrap{max-width:720px;margin:auto;padding:16px}
.search{width:100%;padding:14px 16px;border:0;border-radius:14px;box-shadow:0 2px 12px #0001;font-size:16px;margin-bottom:14px}
.card{background:#fff;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 3px 14px #0000000d;display:flex;align-items:center;justify-content:space-between;gap:12px}
.name{font-weight:700;font-size:17px}.btns{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
button,a{border:0;border-radius:10px;padding:10px 12px;font-weight:700;text-decoration:none;font-size:13px;cursor:pointer}
.map{background:#2563eb;color:#fff}.share{background:#16a34a;color:#fff}.copy{background:#e5e7eb;color:#111827}
#count{text-align:center;color:#64748b;font-size:13px;margin:8px}
</style>
</head>
<body>
<header><h1>📍 Delhi Job Locations</h1><div class="sub">Select a location to open Google Maps</div></header>
<div class="wrap">
<input id="search" class="search" placeholder="🔍 Search location..." oninput="render()">
<div id="count"></div><div id="list"></div>
</div>
<script>
const locations=[
["Sangam Vihar","https://maps.app.goo.gl/pEtTXmNvWBTJn6jb7"],
["Aya Nagar","https://maps.app.goo.gl/Jo2HUHrDjzGPSzQj6"],
["Jasola","https://maps.app.goo.gl/UUjAnWvdNP9rCqs88"],
["Sant Nagar","https://maps.app.goo.gl/SCyVYXHEsc5zCxXd9"],
["Madangiri","https://maps.app.goo.gl/UvgsFrfcdQhDxWZ99"],
["Shakti Vihar","https://maps.app.goo.gl/1qg3FRs7KmZ8K1B69"],
["NFC","https://maps.app.goo.gl/BH3WRUKaYJheoMWG9"],
["Sainik Farm","https://www.google.com/maps?q=28.506641,77.199562"],
["South Ex – Adjoining TVS","https://www.google.com/maps?q=28.574221,77.221481"],
["Chattarpur","https://www.google.com/maps?q=28.49566389,77.184415"],
["Jangpura","https://www.google.com/maps?q=28.58173,77.250427"],
["Lado Sarai","https://www.google.com/maps?q=28.524082,77.1933"],
["Vasant Vihar","https://maps.google.com/?q=28.571104,77.158997"],
["Jia Sarai","https://maps.app.goo.gl/erHk9dqHf3SWVTtU9?g_st=ic"],
["Safdarjung","https://maps.app.goo.gl/jVvEF3neVc5acV2o7?g_st=ic"]
];

function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
 const q=document.getElementById('search').value.toLowerCase().trim();
 const data=locations.filter(x=>x[0].toLowerCase().includes(q));
 document.getElementById('count').textContent=data.length+" location"+(data.length===1?"":"s");
 document.getElementById('list').innerHTML=data.map((x,i)=>`
 <div class="card">
   <div class="name">📍 ${esc(x[0])}</div>
   <div class="btns">
    <a class="map" target="_blank" rel="noopener" href="${x[1]}">🗺️ Maps</a>
    <button class="share" onclick="shareLoc(${locations.indexOf(x)})">📲 Share</button>
    <button class="copy" onclick="copyLoc(${locations.indexOf(x)})">🔗 Copy</button>
   </div>
 </div>`).join('');
}
async function shareLoc(i){
 const [name,url]=locations[i];
 if(navigator.share){try{await navigator.share({title:name,text:"📍 "+name+"\nGoogle Maps Location:",url})}catch(e){}}
 else {await navigator.clipboard.writeText("📍 "+name+"\n"+url);alert("Location link copied!")}
}
async function copyLoc(i){
 const [name,url]=locations[i];
 await navigator.clipboard.writeText(url);
 alert(name+" link copied!");
}
render();
</script>
</body>
</html>
