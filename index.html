<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Job Locations</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
.hero{background:linear-gradient(135deg,#111827,#1e3a8a);color:#fff;padding:42px 20px;text-align:center}
.hero h1{margin:0 0 10px;font-size:38px}.hero p{margin:0;opacity:.85}
.wrap{max-width:1000px;margin:30px auto;padding:0 16px}.panel{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 30px #00000012;margin-bottom:22px}
.panel h2{margin-top:0}.form{display:grid;grid-template-columns:1fr 1fr auto;gap:12px}
input{width:100%;padding:13px 14px;border:1px solid #d8deea;border-radius:10px;font-size:15px}
button{border:0;border-radius:10px;padding:13px 20px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}
.search{margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.card{background:#fff;border:1px solid #e6eaf0;border-radius:16px;padding:18px;box-shadow:0 5px 18px #0000000d}
.card h3{margin:0 0 12px;font-size:19px}.card a{color:#2563eb;text-decoration:none;font-weight:700}.muted,.status{color:#667085;font-size:14px}
.error{color:#b42318;background:#fef3f2;padding:12px;border-radius:10px;display:none;margin-top:12px}
@media(max-width:700px){.form{grid-template-columns:1fr}.hero h1{font-size:30px}}
</style>
</head>
<body>
<section class="hero"><h1>📍 Job Locations</h1><p>Find the latest hiring locations quickly</p></section>
<main class="wrap">
<section class="panel">
<h2>Add Job Location</h2>
<div class="form">
<input id="name" placeholder="Location name (e.g. Okhla Bird Sanctuary)">
<input id="url" placeholder="Google Maps / location link">
<button id="addBtn">Add Location</button>
</div>
<div id="error" class="error"></div>
</section>
<section class="panel">
<input class="search" id="search" placeholder="🔎 Search job locations...">
<div id="locations" class="grid"></div><div id="status" class="status">Loading locations...</div>
</section>
</main>
<script>
const SUPABASE_URL="https://uxbrasxagfcwtbngsgbf.supabase.co";
const SUPABASE_KEY="sb_publishable_iOaSV2iIxiqd6yhqkPq-Sw_odBOgt-K";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let allLocations=[];
async function loadLocations(){
 const {data,error}=await db.from("locations").select("id,name,url,created_at").order("created_at",{ascending:false});
 if(error){showError("Locations load nahi ho pa rahi: "+error.message);document.getElementById("status").textContent="";return;}
 allLocations=data||[];render(allLocations);
}
function render(items){
 const box=document.getElementById("locations"),status=document.getElementById("status");box.innerHTML="";
 if(!items.length){status.textContent="Abhi koi job location add nahi hai.";return;}
 status.textContent="";
 items.forEach(x=>{
  const card=document.createElement("div");card.className="card";
  const h=document.createElement("h3");h.textContent="📍 "+x.name;
  const p=document.createElement("p");p.className="muted";p.textContent="Job location";
  const a=document.createElement("a");a.href=x.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent="Open Location →";
  card.append(h,p,a);box.appendChild(card);
 });
}
document.getElementById("search").addEventListener("input",e=>{
 const q=e.target.value.toLowerCase().trim();render(allLocations.filter(x=>(x.name||"").toLowerCase().includes(q)));
});
document.getElementById("addBtn").addEventListener("click",async()=>{
 const name=document.getElementById("name").value.trim(),url=document.getElementById("url").value.trim();
 if(!name||!url){showError("Location name aur link dono bharna zaroori hai.");return;}
 hideError();const btn=document.getElementById("addBtn");btn.disabled=true;btn.textContent="Adding...";
 const {error}=await db.from("locations").insert([{name,url}]);
 btn.disabled=false;btn.textContent="Add Location";
 if(error){showError("Add nahi hua: "+error.message);return;}
 document.getElementById("name").value="";document.getElementById("url").value="";await loadLocations();
});
function showError(msg){const e=document.getElementById("error");e.textContent=msg;e.style.display="block"}
function hideError(){document.getElementById("error").style.display="none"}
loadLocations();
</script>
</body>
</html>
